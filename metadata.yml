Status: Ready
Title: Chemical Checker Signaturizer 3D C1-5
Description: Captures the network level of the Chemical Checker, five C spaces positioning
  a compound by the biological roles, pathways, processes and interactions its targets
  participate in. Building on a systematic analysis of stereoisomerism across more
  than a million compounds, where about 40% of isomer pairs showed distinct bioactivity,
  the descriptors were learned from three-dimensional molecular representations. Because
  the networks infer signatures for compounds never assayed, output should be read
  as a prediction of biological context.
