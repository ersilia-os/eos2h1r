Title: Chemical Checker Signaturizer 3D C1-5
Description: Captures the network level of the Chemical Checker, five C spaces that
  place a compound by the roles and metabolic pathways of its targets, the signalling
  pathways and biological processes they belong to, and their position in the interactome.
  These spaces derive from target binding data and were among the richest in stereoisomer
  groups in the study behind the model, which fine-tuned Uni-Mol on three-dimensional
  conformers of over a million Chemical Checker molecules. Signatures are inferred,
  so read them as predicted biological context rather than recorded annotation.
